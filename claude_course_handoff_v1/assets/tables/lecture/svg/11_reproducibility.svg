<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="721" viewBox="0 0 1180 721" role="img" aria-labelledby="title desc">
<title id="title">A seed is not always a reconstruction key</title>
<desc id="desc">Archive what actually ran, not only the command that was meant to reproduce it. Reproducibility has several levels: same source, same generated representation and same executable bytes.</desc>
<rect width="1180" height="721" fill="white"/>
<text x="40" y="31" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">SEEING THROUGH OBFUSCATION  /  TABLE 11</text>
<text x="40" y="80" fill="#183B50" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">A seed is not always a reconstruction key</text>
<text x="40" y="119" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Archive what actually ran, not only the command that was meant to reproduce it.</text>
<rect x="40" y="149" width="1100" height="46" fill="#183B50" rx="0"/>
<text x="52" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Tested lane</text>
<text x="338" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Repeat observation</text>
<text x="767" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">What to retain</text>
<rect x="40" y="195" width="1100" height="70" fill="#FFFFFF" rx="0"/>
<rect x="40" y="195" width="286" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="237" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">OLLVM / Hikari SUB</text>
<rect x="326" y="195" width="429" height="70" fill="#E7F0FA" rx="0"/>
<text x="340" y="225.5" fill="#224F78" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">REPEATED IDENTICALLY</text>
<text x="340" y="248.5" fill="#224F78" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Seeded IR in the retained probe</text>
<text x="769" y="225.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Exact flags, compiler identity, IR and PE</text>
<text x="769" y="248.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">hashes.</text>
<line x1="40" y1="265" x2="1140" y2="265" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="265" width="1100" height="70" fill="#F5F8FA" rx="0"/>
<rect x="40" y="265" width="286" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="307" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">Polaris selected IR passes</text>
<rect x="326" y="265" width="429" height="70" fill="#E7F0FA" rx="0"/>
<text x="340" y="295.5" fill="#224F78" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">REPEATED IDENTICALLY</text>
<text x="340" y="318.5" fill="#224F78" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">SUB/BCF/FLA/indirection/gvenc smoke variants</text>
<text x="769" y="295.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Exact artifacts; not a universal seed</text>
<text x="769" y="318.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">guarantee.</text>
<line x1="40" y1="335" x2="1140" y2="335" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="335" width="1100" height="70" fill="#FFFFFF" rx="0"/>
<rect x="40" y="335" width="286" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="377" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">Polaris MBA / backend</text>
<rect x="326" y="335" width="429" height="70" fill="#FFF0D5" rx="0"/>
<text x="340" y="365.5" fill="#744700" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">VARIED</text>
<text x="340" y="388.5" fill="#744700" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Same requested RNG seed was insufficient</text>
<text x="769" y="365.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">The exact generated artifact is the</text>
<text x="769" y="388.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">specimen.</text>
<line x1="40" y1="405" x2="1140" y2="405" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="405" width="1100" height="70" fill="#F5F8FA" rx="0"/>
<rect x="40" y="405" width="286" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="447" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">Tigress</text>
<rect x="326" y="405" width="429" height="70" fill="#FFF0D5" rx="0"/>
<text x="340" y="435.5" fill="#744700" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">WHOLE FILES VARIED</text>
<text x="340" y="458.5" fill="#744700" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Identifier salts / ordering were not pinned</text>
<text x="769" y="435.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Exact generated C, then reuse it across</text>
<text x="769" y="458.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">optimization levels.</text>
<line x1="40" y1="475" x2="1140" y2="475" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="475" width="1100" height="70" fill="#FFFFFF" rx="0"/>
<rect x="40" y="475" width="286" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="517" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">BinProtect</text>
<rect x="326" y="475" width="429" height="70" fill="#FFF0D5" rx="0"/>
<text x="340" y="505.5" fill="#744700" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">NO EXPOSED SEED</text>
<text x="340" y="528.5" fill="#744700" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Outputs varied</text>
<text x="769" y="505.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Exact PE for static analysis; validity failed</text>
<text x="769" y="528.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">here.</text>
<line x1="40" y1="545" x2="1140" y2="545" stroke="#D9E2E8" stroke-width="1"/>
<line x1="326" y1="195" x2="326" y2="545" stroke="#E0E7EC" stroke-width="1"/>
<line x1="755" y1="195" x2="755" y2="545" stroke="#E0E7EC" stroke-width="1"/>
<rect x="40" y="567" width="1100" height="51" fill="#E8F2F6" rx="5"/>
<text x="59" y="598" fill="#183B50" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Reproducibility has several levels: same source, same generated representation and same executable bytes.</text>
<text x="40" y="647.5" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400">Tigress target bodies were more stable than whole generated files; whole-file variation is not proof of semantic variation.</text>
<rect x="40" y="666" width="12" height="12" fill="#E3F3EB" rx="0"/>
<text x="58" y="677" fill="#15533A" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400">Validated</text>
<rect x="135.124" y="666" width="12" height="12" fill="#FFF0D5" rx="0"/>
<text x="153.124" y="677" fill="#744700" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400">Qualified / incomplete</text>
<rect x="298.327" y="666" width="12" height="12" fill="#FCE5E8" rx="0"/>
<text x="316.327" y="677" fill="#922838" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400">Wrong / invalid</text>
<rect x="423.999" y="666" width="12" height="12" fill="#E7F0FA" rx="0"/>
<text x="441.999" y="677" fill="#224F78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400">Observation</text>
<rect x="534.394" y="666" width="12" height="12" fill="#EEF1F4" rx="0"/>
<text x="552.394" y="677" fill="#465462" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400">Not produced</text>
<text x="40" y="697" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">Windows x64 | Retained samples only | Source keys in SOURCES.md</text>
</svg>
