<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="651" viewBox="0 0 1180 651" role="img" aria-labelledby="title desc">
<title id="title">Flattening can survive without an indirect jump</title>
<desc id="desc">FLA = control-flow flattening. Look for state-driven dispatch, not one opcode. A direct chain of comparisons can implement the same flattened state machine as a jump table.</desc>
<rect width="1180" height="651" fill="white"/>
<text x="40" y="31" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">SEEING THROUGH OBFUSCATION  /  TABLE 05</text>
<text x="40" y="80" fill="#183B50" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Flattening can survive without an indirect jump</text>
<text x="40" y="119" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">FLA = control-flow flattening. Look for state-driven dispatch, not one opcode.</text>
<rect x="40" y="149" width="1100" height="46" fill="#183B50" rx="0"/>
<text x="52" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Treatment</text>
<text x="272" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">At O0</text>
<text x="558" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">At higher optimization</text>
<text x="866" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">What to look for</text>
<rect x="40" y="195" width="1100" height="70" fill="#FFFFFF" rx="0"/>
<rect x="40" y="195" width="220" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="237" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">OLLVM FLA</text>
<text x="274" y="237" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">State/switch dispatcher</text>
<text x="560" y="237" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Strong flattening persists</text>
<text x="868" y="225.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Repeated state tests and</text>
<text x="868" y="248.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">returns to dispatch.</text>
