<text x="54" y="307" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">Hikari FLA</text>
<text x="274" y="307" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">State/switch dispatcher</text>
<text x="560" y="307" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Strong flattening persists</text>
<text x="868" y="295.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Dispatcher structure despite</text>
<text x="868" y="318.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">simpler blocks.</text>
