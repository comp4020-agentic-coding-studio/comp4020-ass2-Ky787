<text x="274" y="377" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Strong state dispatcher</text>
<text x="560" y="377" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Smaller, but still flattened</text>
