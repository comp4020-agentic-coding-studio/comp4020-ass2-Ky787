<text x="40" y="717.5" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400">Export names: demo_substitution, demo_bogus_control_flow, demo_flattening. Story 06 rewrite is failure evidence.</text>
