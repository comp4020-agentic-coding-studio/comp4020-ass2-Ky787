<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="791" viewBox="0 0 1180 791" role="img" aria-labelledby="title desc">
<title id="title">Six examples worth opening in IDA</title>
<desc id="desc">Use the evidence-pack walkthrough for exact binaries, hashes and RVAs. Start with matched clean binaries. For every rewrite, navigate by export / RVA and distrust old PDB mappings.</desc>
<rect width="1180" height="791" fill="white"/>
<text x="40" y="31" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">SEEING THROUGH OBFUSCATION  /  TABLE 12</text>
<text x="40" y="80" fill="#183B50" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Six examples worth opening in IDA</text>
<text x="40" y="119" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Use the evidence-pack walkthrough for exact binaries, hashes and RVAs.</text>
<rect x="40" y="149" width="1100" height="46" fill="#183B50" rx="0"/>
<text x="52" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Story</text>
<text x="316" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Target</text>
<text x="525" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">What to compare</text>
<text x="833" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Teaching point</text>
<rect x="40" y="195" width="1100" height="70" fill="#FFFFFF" rx="0"/>
<rect x="40" y="195" width="264" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="237" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">01 - OLLVM SUB</text>
<text x="318" y="237" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Substitution</text>
<text x="527" y="237" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Clean vs SUB; native code vs IR</text>
<text x="835" y="225.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Backend canonicalization can undo</text>
<text x="835" y="248.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">apparent complexity.</text>
<line x1="40" y1="265" x2="1140" y2="265" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="265" width="1100" height="70" fill="#F5F8FA" rx="0"/>
<rect x="40" y="265" width="264" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="307" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">02 - Polaris MBA</text>
<text x="318" y="307" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Substitution</text>
<text x="527" y="307" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">115 vs 678 native instructions</text>
<text x="835" y="295.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Large arithmetic expansion without</text>
<text x="835" y="318.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">many CFG blocks.</text>
<line x1="40" y1="335" x2="1140" y2="335" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="335" width="1100" height="70" fill="#FFFFFF" rx="0"/>
<rect x="40" y="335" width="264" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="377" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">03 - OLLVM BCF</text>
<text x="318" y="377" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Bogus control flow</text>
<text x="527" y="377" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Clean / original / Triton rewrite</text>
<text x="835" y="365.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Proof-driven removal of impossible</text>
<text x="835" y="388.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">edges.</text>
<line x1="40" y1="405" x2="1140" y2="405" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="405" width="1100" height="70" fill="#F5F8FA" rx="0"/>
<rect x="40" y="405" width="264" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="447" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">04 - Polaris BCF</text>
<text x="318" y="447" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Bogus control flow</text>
<text x="527" y="435.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Same workflow, another</text>
<text x="527" y="458.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">implementation</text>
<text x="835" y="435.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Semantic transfer is stronger than</text>
<text x="835" y="458.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">one signature match.</text>
<line x1="40" y1="475" x2="1140" y2="475" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="475" width="1100" height="70" fill="#FFFFFF" rx="0"/>
<rect x="40" y="475" width="264" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="517" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">05 - OLLVM FLA</text>
<text x="318" y="517" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Flattening</text>
<text x="527" y="505.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Dispatcher vs working stock</text>
<text x="527" y="528.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">rewrite</text>
<text x="835" y="505.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Recovered semantics need not</text>
<text x="835" y="528.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">reproduce the clean graph.</text>
<line x1="40" y1="545" x2="1140" y2="545" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="545" width="1100" height="70" fill="#F5F8FA" rx="0"/>
<rect x="40" y="545" width="264" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="587" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">06 - Polaris FLA</text>
<text x="318" y="587" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Flattening</text>
<text x="527" y="575.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Original vs explicitly marked</text>
<text x="527" y="598.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">wrong rewrite</text>
<text x="835" y="575.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">A cleaner-looking graph can</text>
<text x="835" y="598.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">compute the wrong answer.</text>
