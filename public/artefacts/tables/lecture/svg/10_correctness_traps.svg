<text x="40" y="119" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Keep visual appearance, representation validity and semantic correctness separate.</text>
<rect x="40" y="149" width="1100" height="46" fill="#183B50" rx="0"/>
