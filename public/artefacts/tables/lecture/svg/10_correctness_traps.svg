<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="651" viewBox="0 0 1180 651" role="img" aria-labelledby="title desc">
<title id="title">Four tempting conclusions to avoid</title>
<desc id="desc">Keep visual appearance, representation validity and semantic correctness separate. Validate the output at the level of the claim: expression, CFG, lifted function or complete executable.</desc>
<rect width="1180" height="651" fill="white"/>
<text x="40" y="31" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">SEEING THROUGH OBFUSCATION  /  TABLE 10</text>
