<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="895" viewBox="0 0 1180 895" role="img" aria-labelledby="title desc">
<title id="title">What does each deobfuscator actually produce?</title>
<desc id="desc">Expression recovery, a branch proof, LLVM IR and a rewritten PE are different outputs. Ask two questions: what representation was recovered, and how was its correctness checked?</desc>
<rect width="1180" height="895" fill="white"/>
<text x="40" y="31" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">SEEING THROUGH OBFUSCATION  /  TABLE 06</text>
<text x="40" y="80" fill="#183B50" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">What does each deobfuscator actually produce?</text>
<text x="40" y="119" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Expression recovery, a branch proof, LLVM IR and a rewritten PE are different outputs.</text>
<rect x="40" y="149" width="1100" height="46" fill="#183B50" rx="0"/>
<text x="52" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Workflow</text>
<text x="305" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Input / idea</text>
<text x="602" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Delivered result</text>
<text x="844" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Boundary to remember</text>
<rect x="40" y="195" width="1100" height="70" fill="#FFFFFF" rx="0"/>
<rect x="40" y="195" width="253" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="237" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">msynth AST/oracle</text>
<text x="307" y="225.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Extracted expression; rewrite /</text>
<text x="307" y="248.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">match</text>
<text x="604" y="237" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Simpler expression</text>
<text x="846" y="237" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">No rewritten PE in this study.</text>
<line x1="40" y1="265" x2="1140" y2="265" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="265" width="1100" height="70" fill="#F5F8FA" rx="0"/>
<rect x="40" y="265" width="253" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="307" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">SiMBA</text>
<text x="307" y="307" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Algebraic MBA simplification</text>
<text x="604" y="307" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Simpler expression</text>
<text x="846" y="295.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Partial reduction is not full</text>
<text x="846" y="318.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">recovery.</text>
<line x1="40" y1="335" x2="1140" y2="335" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="335" width="1100" height="70" fill="#FFFFFF" rx="0"/>
<rect x="40" y="335" width="253" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="377" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">Synthesizer</text>
<text x="307" y="377" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Search for a small expression</text>
<text x="604" y="377" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Candidate expression</text>
<text x="846" y="365.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Accept only after equivalence</text>
<text x="846" y="388.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">proof.</text>
<line x1="40" y1="405" x2="1140" y2="405" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="405" width="1100" height="70" fill="#F5F8FA" rx="0"/>
<rect x="40" y="405" width="253" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="447" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">ollvm-unflattener</text>
<text x="307" y="435.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Discover states; recover</text>
<text x="307" y="458.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">successors</text>
<text x="604" y="447" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Rewritten PE or failure</text>
<text x="846" y="435.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">A produced PE can have wrong</text>
<text x="846" y="458.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">semantics.</text>
<line x1="40" y1="475" x2="1140" y2="475" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="475" width="1100" height="70" fill="#FFFFFF" rx="0"/>
<rect x="40" y="475" width="253" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="517" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">Triton DSE/SMT</text>
<text x="307" y="517" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Symbolic branch conditions</text>
<text x="604" y="517" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Proof / witness</text>
<text x="846" y="505.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Analysis itself does not patch the</text>
<text x="846" y="528.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">PE.</text>
<line x1="40" y1="545" x2="1140" y2="545" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="545" width="1100" height="70" fill="#F5F8FA" rx="0"/>
<rect x="40" y="545" width="253" height="70" fill="#ECF2F5" rx="0"/>
<text x="54" y="587" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">Proof-driven rewriter</text>
<text x="307" y="575.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Consume proofs and exact</text>
<text x="307" y="598.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">bytes</text>
<text x="604" y="587" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Patched PE</text>
<text x="846" y="575.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Predicates and dead bytes can</text>
<text x="846" y="598.5" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">remain.</text>
<line x1="40" y1="615" x2="1140" y2="615" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="615" width="1100" height="52" fill="#FFFFFF" rx="0"/>
<rect x="40" y="615" width="253" height="52" fill="#ECF2F5" rx="0"/>
<text x="54" y="648" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">Mergen</text>
<text x="307" y="648" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Lift x64 instructions</text>
<text x="604" y="648" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">LLVM IR</text>
<text x="846" y="648" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Valid IR can silently miscompute.</text>
<line x1="40" y1="667" x2="1140" y2="667" stroke="#D9E2E8" stroke-width="1"/>
<rect x="40" y="667" width="1100" height="52" fill="#F5F8FA" rx="0"/>
<rect x="40" y="667" width="253" height="52" fill="#ECF2F5" rx="0"/>
<text x="54" y="700" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700">Ordinary LLVM O2</text>
<text x="307" y="700" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Optimize retained or lifted IR</text>
<text x="604" y="700" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Optimized IR</text>
<text x="846" y="700" fill="#172C3D" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="400">Cannot repair an unsound lift.</text>
<line x1="40" y1="719" x2="1140" y2="719" stroke="#D9E2E8" stroke-width="1"/>
<line x1="293" y1="195" x2="293" y2="719" stroke="#E0E7EC" stroke-width="1"/>
<line x1="590" y1="195" x2="590" y2="719" stroke="#E0E7EC" stroke-width="1"/>
<line x1="832" y1="195" x2="832" y2="719" stroke="#E0E7EC" stroke-width="1"/>
<rect x="40" y="741" width="1100" height="51" fill="#E8F2F6" rx="5"/>
<text x="59" y="772" fill="#183B50" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Ask two questions: what representation was recovered, and how was its correctness checked?</text>
<text x="40" y="821.5" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400">PE = Windows Portable Executable. The Mergen test harness is not a rewritten original PE.</text>
<rect x="40" y="840" width="12" height="12" fill="#E3F3EB" rx="0"/>
<text x="58" y="851" fill="#15533A" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400">Validated</text>
<rect x="135.124" y="840" width="12" height="12" fill="#FFF0D5" rx="0"/>
<text x="153.124" y="851" fill="#744700" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400">Qualified / incomplete</text>
<rect x="298.327" y="840" width="12" height="12" fill="#FCE5E8" rx="0"/>
<text x="316.327" y="851" fill="#922838" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400">Wrong / invalid</text>
<rect x="423.999" y="840" width="12" height="12" fill="#E7F0FA" rx="0"/>
<text x="441.999" y="851" fill="#224F78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400">Observation</text>
<rect x="534.394" y="840" width="12" height="12" fill="#EEF1F4" rx="0"/>
<text x="552.394" y="851" fill="#465462" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400">Not produced</text>
<text x="40" y="871" fill="#546776" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">Windows x64 | Retained samples only | Source keys in SOURCES.md</text>
</svg>
